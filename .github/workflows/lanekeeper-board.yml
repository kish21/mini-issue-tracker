name: Lanekeeper board (manual)

# Runs `lanekeeper board` on a GitHub runner, so the board can be created and read
# without a terminal. Needs a repository secret LANEKEEPER_GH_TOKEN holding a classic
# personal access token with the `repo` and `project` scopes: the board is a GitHub
# Project, and the workflow's own GITHUB_TOKEN cannot create or read those.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (print every action, change nothing) | create | show"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, create, show]

jobs:
  board:
    name: lanekeeper board (${{ inputs.mode }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lanekeeper
        run: python -m pip install --upgrade pip lanekeeper

      - name: Check the token can see projects
        env:
          GH_TOKEN: ${{ secrets.LANEKEEPER_GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add a repository secret LANEKEEPER_GH_TOKEN (classic PAT, scopes: repo, project)."
            exit 1
          fi
          gh auth status

      - name: lanekeeper board
        env:
          GH_TOKEN: ${{ secrets.LANEKEEPER_GH_TOKEN }}
        run: |
          case "${{ inputs.mode }}" in
            dry-run) lanekeeper board --dry-run --repo "$GITHUB_REPOSITORY" ;;
            create)  lanekeeper board --repo "$GITHUB_REPOSITORY" ;;
            show)    lanekeeper board --show ;;
          esac

      - name: Generated inputs (for the record)
        if: always()
        run: cat .lanekeeper/board.conf || true
